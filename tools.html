<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地全能文件转换器 · 工具箱</title>
<style>
:root{
  --bg:#f7f5f0;
  --card:#ffffff;
  --ink:#2c2825;
  --ink-soft:#7a726c;
  --accent:#b5654a;
  --accent-deep:#9a5037;
  --accent-soft:#f3e3dc;
  --line:#e8e2d9;
  --radius:16px;
  --shadow:0 8px 28px rgba(60,48,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  min-height:100vh;padding:28px 20px 60px;
}
.container{max-width:820px;margin:0 auto}

/* 顶部栏 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;flex-wrap:wrap;gap:12px;
}
.back-link{
  text-decoration:none;color:var(--ink-soft);font-size:13.5px;
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);transition:.2s;
}
.back-link:hover{border-color:var(--accent);color:var(--accent)}
.privacy-tag{
  font-size:12px;color:var(--accent-deep);background:var(--accent-soft);
  padding:4px 12px;border-radius:999px;
}

.header{text-align:center;margin-bottom:26px}
.header h1{font-size:24px;font-weight:700;letter-spacing:.5px}
.header p{font-size:13.5px;color:var(--ink-soft);margin-top:4px}

/* 模式切换 Tabs */
.tabs{
  display:flex;gap:10px;justify-content:center;margin-bottom:22px;
}
.tab-btn{
  padding:10px 22px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft);font-size:14px;font-weight:600;
  cursor:pointer;transition:.2s;
}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow)}

/* 主卡片 */
.panel{
  display:none;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);
}
.panel.active{display:block}

/* 拖拽上传区 */
.dropzone{
  border:2px dashed var(--line);border-radius:14px;padding:34px 20px;
  text-align:center;cursor:pointer;transition:.2s;background:#fcfbf9;
}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:var(--accent-soft)}
.dropzone-icon{font-size:32px;margin-bottom:8px}
.dropzone-title{font-size:15px;font-weight:600}
.dropzone-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}

/* 控制表单 */
.controls{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line);
}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:500}
.field select,.field input[type="range"]{width:100%}
.field select{
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;background:#fff;color:var(--ink);outline:none;
}
.field select:focus{border-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:10px}
.range-val{font-size:13px;font-weight:600;color:var(--accent-deep);min-width:40px;text-align:right}

/* 按钮 */
.actions{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-primary{
  padding:11px 28px;border-radius:999px;border:none;background:var(--accent);
  color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:.2s;
}
.btn-primary:hover:not(:disabled){background:var(--accent-deep);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.btn-download{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  padding:10px 24px;border-radius:999px;background:#2e7d32;color:#fff;
  font-size:14px;font-weight:600;transition:.2s;
}
.btn-download:hover{background:#1b5e20}

/* 结果与状态区 */
.result-box{
  display:none;margin-top:22px;padding:18px;border-radius:12px;
  background:#faf8f5;border:1px solid var(--line);text-align:center;
}
.result-box.show{display:block}
.stat-line{font-size:13.5px;margin-bottom:12px;color:var(--ink)}
.badge-save{
  display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;
  background:#e8f5e9;color:#2e7d32;font-weight:600;margin-left:6px;
}
.preview-img{max-width:100%;max-height:260px;border-radius:10px;margin:10px auto;display:block;border:1px solid var(--line)}
.preview-media{width:100%;max-height:300px;border-radius:10px;margin:10px 0}

/* 进度条 */
.progress-wrap{display:none;margin-top:18px}
.progress-wrap.show{display:block}
.progress-bar{
  width:100%;height:10px;background:var(--line);border-radius:999px;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;background:var(--accent);transition:width .25s;
}
.progress-text{font-size:12.5px;color:var(--ink-soft);margin-top:6px;text-align:center}
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <a href="/" class="back-link">← 返回导航首页</a>
    <span class="privacy-tag">🔒 100% 本地浏览器处理 · 文件不上传服务器</span>
  </div>

  <header class="header">
    <h1>本地全能文件转换器</h1>
    <p>支持图片格式互转与无损感压缩，以及音视频转码与伴奏提取</p>
  </header>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="imgPanel">🖼️ 图片转换 / 压缩</button>
    <button type="button" class="tab-btn" data-tab="avPanel">🎬 音视频转换 / 提取</button>
  </div>

  <!-- ================= 面板 1：图片转换 ================= -->
  <section class="panel active" id="imgPanel">
    <div class="dropzone" id="imgDrop">
      <div class="dropzone-icon">🖼️</div>
      <div class="dropzone-title" id="imgFileName">点击选择图片，或将图片拖拽到这里</div>
      <div class="dropzone-sub">支持 JPG / PNG / WebP / BMP / GIF 等常见格式</div>
      <input type="file" id="imgInput" accept="image/*" hidden>
    </div>

    <div class="controls">
      <div class="field">
        <label>目标格式</label>
        <select id="imgFormat">
          <option value="image/webp">WebP（体积最小 · 推荐网页使用）</option>
          <option value="image/jpeg">JPG（通用兼容性最好）</option>
          <option value="image/png">PNG（保留透明背景）</option>
        </select>
      </div>
      <div class="field">
        <label>最大尺寸限制（等比例缩放）</label>
        <select id="imgMaxWidth">
          <option value="0">保持原始分辨率</option>
          <option value="1920">最大宽度 1920px（高清屏）</option>
          <option value="1280">最大宽度 1280px（适合博客/社交）</option>
          <option value="800">最大宽度 800px（轻量缩略图）</option>
        </select>
      </div>
      <div class="field">
        <label>压缩画质（PNG 格式忽略此项）</label>
        <div class="range-row">
          <input type="range" id="imgQuality" min="10" max="100" value="85">
          <span class="range-val" id="imgQualityVal">85%</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" id="imgConvertBtn" disabled>开始转换图片</button>
    </div>

    <div class="result-box" id="imgResult">
      <div class="stat-line" id="imgStat"></div>
      <img class="preview-img" id="imgPreview" alt="转换预览">
      <div style="margin-top:12px">
        <a class="btn-download" id="imgDownload" download>⬇️ 下载转换后的图片</a>
      </div>
    </div>
  </section>

  <!-- ================= 面板 2：音视频转换 ================= -->
  <section class="panel" id="avPanel">
    <div class="dropzone" id="avDrop">
      <div class="dropzone-icon">🎬</div>
      <div class="dropzone-title" id="avFileName">点击选择视频或音频，或拖拽到这里</div>
      <div class="dropzone-sub">支持 MP4 / MKV / MOV / WebM / MP3 / WAV / M4A / OGG（建议 500MB 以内）</div>
      <input type="file" id="avInput" accept="video/*,audio/*" hidden>
    </div>

    <div class="controls">
      <div class="field">
        <label>目标格式</label>
        <select id="avFormat">
          <optgroup label="音频格式（支持从视频中直接提取声音）">
            <option value="mp3">MP3 音频（通用标准 · 192kbps）</option>
            <option value="m4a">M4A 音频（AAC 高音质）</option>
            <option value="wav">WAV 无损音频</option>
            <option value="ogg">OGG 音频</option>
          </optgroup>
          <optgroup label="视频与动图格式">
            <option value="mp4">MP4 视频（H.264 通用兼容压缩）</option>
            <option value="webm">WebM 视频（网页轻量格式）</option>
            <option value="gif">GIF 动图（自动缩放至 480p · 10fps）</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" id="avConvertBtn" disabled>开始本地转码</button>
    </div>

    <div class="progress-wrap" id="avProgressWrap">
      <div class="progress-bar"><div class="progress-fill" id="avProgressFill"></div></div>
      <div class="progress-text" id="avProgressText">准备中...</div>
    </div>

    <div class="result-box" id="avResult">
      <div class="stat-line" id="avStat"></div>
      <div id="avPlayerWrap"></div>
      <div style="margin-top:12px">
        <a class="btn-download" id="avDownload" download>⬇️ 下载转换后的文件</a>
      </div>
    </div>
  </section>
</div>

<!-- 引入单线程版 ffmpeg.wasm（无需服务器特殊响应头，纯前端兼容所有静态托管） -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const formatBytes = bytes => {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
};

/* ============ Tab 切换 ============ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
  };
});

/* 通用拖拽绑定 */
function bindDropzone(dropEl, inputEl, onFile) {
  dropEl.onclick = () => inputEl.click();
  inputEl.onchange = () => { if (inputEl.files[0]) onFile(inputEl.files[0]); };
  dropEl.ondragover = e => { e.preventDefault(); dropEl.classList.add("dragover"); };
  dropEl.ondragleave = () => dropEl.classList.remove("dragover");
  dropEl.ondrop = e => {
    e.preventDefault();
    dropEl.classList.remove("dragover");
    if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
  };
}

/* ============ 1. 图片转换与压缩（原生 Canvas） ============ */
let currentImgFile = null;
let lastImgUrl = null;
const imgQuality = document.getElementById("imgQuality");
imgQuality.oninput = () => document.getElementById("imgQualityVal").textContent = imgQuality.value + "%";

bindDropzone(document.getElementById("imgDrop"), document.getElementById("imgInput"), file => {
  currentImgFile = file;
  document.getElementById("imgFileName").textContent = `已选择：${file.name} (${formatBytes(file.size)})`;
  document.getElementById("imgConvertBtn").disabled = false;
  document.getElementById("imgResult").classList.remove("show");
});

document.getElementById("imgConvertBtn").onclick = () => {
  if (!currentImgFile) return;
  const mime = document.getElementById("imgFormat").value;
  const maxW = Number(document.getElementById("imgMaxWidth").value);
  const quality = Number(imgQuality.value) / 100;
  const extMap = { "image/webp": "webp", "image/jpeg": "jpg", "image/png": "png" };

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (maxW > 0 && w > maxW) {
        h = Math.round(h * (maxW / w));
        w = maxW;
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (mime === "image/jpeg") {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
      }
      ctx.drawImage(img, 0, 0, w, h);

      canvas.toBlob(blob => {
        if (!blob) return alert("转换失败，请尝试其他格式");
        if (lastImgUrl) URL.revokeObjectURL(lastImgUrl);
        lastImgUrl = URL.createObjectURL(blob);

        const baseName = currentImgFile.name.replace(/\.[^.]+$/, "");
        const outName = `${baseName}.${extMap[mime]}`;
        const diff = ((1 - blob.size / currentImgFile.size) * 100).toFixed(1);
        const badge = diff > 0
          ? `<span class="badge-save">体积减小 ${diff}%</span>`
          : `<span class="badge-save" style="background:#fff3e0;color:#e65100">体积变化 +${Math.abs(diff)}%</span>`;

        document.getElementById("imgStat").innerHTML =
          `原始：<b>${formatBytes(currentImgFile.size)}</b> → 转换后：<b>${formatBytes(blob.size)}</b> (${w}×${h}) ${badge}`;
        document.getElementById("imgPreview").src = lastImgUrl;
        const dl = document.getElementById("imgDownload");
        dl.href = lastImgUrl;
        dl.download = outName;
        document.getElementById("imgResult").classList.add("show");
      }, mime, quality);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(currentImgFile);
};

/* ============ 2. 音视频转换（FFmpeg.wasm 单线程） ============ */
let currentAvFile = null;
let lastAvUrl = null;
let ffmpegInstance = null;

bindDropzone(document.getElementById("avDrop"), document.getElementById("avInput"), file => {
  if (file.size > 500 * 1024 * 1024) {
    alert("提示：该文件超过 500MB，浏览器内存可能不足，建议选择 500MB 以内的文件。");
  }
  currentAvFile = file;
  document.getElementById("avFileName").textContent = `已选择：${file.name} (${formatBytes(file.size)})`;
  document.getElementById("avConvertBtn").disabled = false;
  document.getElementById("avResult").classList.remove("show");
});

document.getElementById("avConvertBtn").onclick = async () => {
  if (!currentAvFile) return;
  const btn = document.getElementById("avConvertBtn");
  const progWrap = document.getElementById("avProgressWrap");
  const progFill = document.getElementById("avProgressFill");
  const progText = document.getElementById("avProgressText");
  const targetExt = document.getElementById("avFormat").value;

  btn.disabled = true;
  progWrap.classList.add("show");
  progFill.style.width = "5%";
  document.getElementById("avResult").classList.remove("show");

  try {
    if (!ffmpegInstance) {
      progText.textContent = "首次使用正在加载本地转码引擎（约 25MB，加载后浏览器会自动缓存）...";
      const { createFFmpeg } = FFmpeg;
      ffmpegInstance = createFFmpeg({
        log: false,
        corePath: "https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js"
      });
      ffmpegInstance.setProgress(({ ratio }) => {
        if (ratio >= 0 && ratio <= 1) {
          const pct = Math.max(10, Math.round(ratio * 100));
          progFill.style.width = pct + "%";
          progText.textContent = `正在本地转码中... ${pct}%（请勿关闭页面）`;
        }
      });
      await ffmpegInstance.load();
    }

    progText.textContent = "正在读取文件到内存...";
    const inExt = (currentAvFile.name.split(".").pop() || "mp4").toLowerCase();
    const inName = `input.${inExt}`;
    const outName = `output.${targetExt}`;

    const buf = await currentAvFile.arrayBuffer();
    ffmpegInstance.FS("writeFile", inName, new Uint8Array(buf));

    // 针对不同输出格式配置高效参数
    let args = ["-i", inName];
    if (targetExt === "mp3") {
      args.push("-vn", "-acodec", "libmp3lame", "-b:a", "192k", outName);
    } else if (targetExt === "m4a") {
      args.push("-vn", "-c:a", "aac", "-b:a", "192k", outName);
    } else if (targetExt === "wav") {
      args.push("-vn", outName);
    } else if (targetExt === "ogg") {
      args.push("-vn", "-c:a", "libvorbis", "-q:a", "4", outName);
    } else if (targetExt === "mp4") {
      args.push("-c:v", "libx264", "-preset", "ultrafast", "-crf", "26", "-c:a", "aac", "-b:a", "128k", outName);
    } else if (targetExt === "webm") {
      args.push("-c:v", "libvpx", "-crf", "12", "-b:v", "1M", "-c:a", "libvorbis", outName);
    } else if (targetExt === "gif") {
      args.push("-vf", "fps=10,scale=480:-1:flags=lanczos", outName);
    }

    await ffmpegInstance.run(...args);

    const data = ffmpegInstance.FS("readFile", outName);
    // 清理虚拟内存中的临时文件
    try { ffmpegInstance.FS("unlink", inName); ffmpegInstance.FS("unlink", outName); } catch (e) {}

    const mimeMap = {
      mp3: "audio/mpeg", m4a: "audio/mp4", wav: "audio/wav", ogg: "audio/ogg",
      mp4: "video/mp4", webm: "video/webm", gif: "image/gif"
    };
    const blob = new Blob([data.buffer], { type: mimeMap[targetExt] || "application/octet-stream" });
    if (lastAvUrl) URL.revokeObjectURL(lastAvUrl);
    lastAvUrl = URL.createObjectURL(blob);

    const baseName = currentAvFile.name.replace(/\.[^.]+$/, "");
    document.getElementById("avStat").innerHTML =
      `原始：<b>${formatBytes(currentAvFile.size)}</b> → 转换后：<b>${formatBytes(blob.size)}</b>`;

    const playerWrap = document.getElementById("avPlayerWrap");
    if (["mp3", "m4a", "wav", "ogg"].includes(targetExt)) {
      playerWrap.innerHTML = `<audio class="preview-media" controls src="${lastAvUrl}"></audio>`;
    } else if (targetExt === "gif") {
      playerWrap.innerHTML = `<img class="preview-img" src="${lastAvUrl}" alt="GIF预览">`;
    } else {
      playerWrap.innerHTML = `<video class="preview-media" controls src="${lastAvUrl}"></video>`;
    }

    const dl = document.getElementById("avDownload");
    dl.href = lastAvUrl;
    dl.download = `${baseName}.${targetExt}`;

    progFill.style.width = "100%";
    progText.textContent = "转换完成！";
    document.getElementById("avResult").classList.add("show");
  } catch (err) {
    alert("转码过程中出错：" + err.message);
    progText.textContent = "转换失败，请检查文件是否损坏或体积过大。";
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
